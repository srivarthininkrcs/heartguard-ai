<!DOCTYPE html>
<html>
<head>

<title>Heart Disease Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}

.header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:15px;
    font-size:30px;
    font-weight:bold;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.card{
    width:220px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px gray;
}

.card h2{
    margin:0;
    color:#333;
}

.card h1{
    color:#007bff;
}

.chart-container{
    width:350px;
    height:280px;
    margin:20px auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 10px gray;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.heart-card{
    width:400px;
    margin:25px 0 25px 30px;
    background:#0d1d32;
    color:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.heart3d{
    width:300px;
    filter:drop-shadow(0 0 18px red);
}

.cards{
    display:flex;
    flex-direction:row;
    justify-content:center;
    gap:20px;
    flex-wrap:nowrap;
}

.chart-row{
    display:flex;
    flex-direction:row;
    justify-content:center;
    gap:20px;
    align-items:flex-start;
}

.chart-container{
    width:350px;
    height:280px;
    margin:20px 0;
}

.main-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin:25px auto;
}

.heart-card{
    width:260px;
    margin:0;
    padding:15px;
}

.heart3d{
    width:170px;
}

.chart-container{
    width:260px;
    height:230px;
    margin:0;
    padding:12px;
}

</style>

</head>

<body>

<div class="header">
Heart Disease Dashboard
</div>

<div class="cards">

<div class="card">
<h2>Total Patients</h2>
<h1>{{ total }}</h1>
</div>

<div class="card">
<h2>High Risk</h2>
<h1>{{ high }}</h1>
</div>

<div class="card">
<h2>Low Risk</h2>
<h1>{{ low }}</h1>
</div>

</div>

<div class="main-row">

    <div class="heart-card">
        <h2>3D Heart</h2>
        <img src="{{ url_for('static', filename='heart3d.png') }}"
             class="heart3d">
    </div>

    <div class="chart-container">
        <h2>Risk Distribution</h2>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="chart-container">
        <h2>Risk Comparison</h2>
        <canvas id="barChart"></canvas>
    </div>

</div>

</div>

<center>
<br>
<a href="/">
<button>Back to Home</button>
</a>
<a href="/details">
<button>Advanced Analytics</button>
</a>
<a href="/download-report">
    <button>⬇ Download Report</button>
</a>
</center>

<!-- Store Flask values safely -->
<div id="data"
     data-high="{{ high }}"
     data-low="{{ low }}"
     style="display:none;">
</div>

<script>

const dataBox = document.getElementById("data");

const highRisk =
    Number(dataBox.dataset.high);

const lowRisk =
    Number(dataBox.dataset.low);


/* PIE CHART */

new Chart(
    document.getElementById("pieChart"),
    {
        type: "pie",

        data: {
            labels: [
                "High Risk",
                "Low Risk"
            ],

            datasets: [{
                data: [
                    highRisk,
                    lowRisk
                ]
            }]
        },

        options: {
            responsive: true
        }
    }
);


/* BAR CHART */

new Chart(
    document.getElementById("barChart"),
    {
        type: "bar",

        data: {
            labels: [
                "High Risk",
                "Low Risk"
            ],

            datasets: [{
                label: "Patients",

                data: [
                    highRisk,
                    lowRisk
                ]
            }]
        },

        options: {
            responsive: true,

            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    }
);

</script>

</body>
</html>
